<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2b52">
<meta name="description" content="2027 수능 국어 연계 우선 학습: 중요 문학 S·A 34, 문학 25작품·독서 20제재 학습 카드, 작품 색인 75개, 수능완성 학습맵 연결">
<title>국어 파이널 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

:root{
 --bg:#f6f3ec;--card:#fff;--card2:#f3f0e8;--ink:#1d2433;--muted:#667086;--line:#e5e0d4;
 --brand:#2f5bd3;--brand-ink:#fff;--accent:#ff7a45;--good:#13875a;--good-bg:#e5f6ee;--bad:#cf3f37;--bad-bg:#fdeceb;
 --pt:#2f5bd3;--pt-bg:#eaf0ff;--trap:#cf3f37;--trap-bg:#fff0ee;--one-bg:#fff6d6;--one-ink:#5a4300;--fix-bg:#f0ebff;--fix-ink:#4b2e9e;
 --blank:#33405f;--hl:#ffe17a;--shadow:0 2px 10px rgba(40,40,60,.06);--era:#2f5bd3;
 --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#10141c;--card:#18202c;--card2:#1f2836;--ink:#e9edf4;--muted:#9aa4b6;--line:#2c3545;
 --brand:#7ea2ff;--brand-ink:#0e1420;--accent:#ff9466;--good:#4fd69a;--good-bg:#173528;--bad:#ff8a80;--bad-bg:#3a1f1e;
 --pt:#9db8ff;--pt-bg:#1c2846;--trap:#ff9a90;--trap-bg:#3a1f1e;--one-bg:#3a3215;--one-ink:#ffe8a0;--fix-bg:#2a2244;--fix-ink:#cdbcff;
 --blank:#4a5778;--hl:#6b5a12;--shadow:none}}
:root[data-theme="dark"]{
 --bg:#10141c;--card:#18202c;--card2:#1f2836;--ink:#e9edf4;--muted:#9aa4b6;--line:#2c3545;
 --brand:#7ea2ff;--brand-ink:#0e1420;--accent:#ff9466;--good:#4fd69a;--good-bg:#173528;--bad:#ff8a80;--bad-bg:#3a1f1e;
 --pt:#9db8ff;--pt-bg:#1c2846;--trap:#ff9a90;--trap-bg:#3a1f1e;--one-bg:#3a3215;--one-ink:#ffe8a0;--fix-bg:#2a2244;--fix-ink:#cdbcff;
 --blank:#4a5778;--hl:#6b5a12;--shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main:focus,main:focus-visible{outline:none}
a{color:var(--brand)}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem}
.logo{display:flex;align-items:center;gap:.55rem;font-weight:900;font-size:1.05rem;letter-spacing:-.02em;background:none;border:0;padding:0;color:var(--ink)}
.logo i{width:2rem;height:2rem;border-radius:.6rem;background:linear-gradient(135deg,#2f5bd3,#7a4fc4);color:#fff;display:grid;place-items:center;font-style:normal;font-size:1rem}
.top .sp{flex:1}
.dday{font-weight:900;font-size:.85rem;background:var(--accent);color:#fff;border-radius:99px;padding:.2rem .7rem}
.ibtn{width:2.5rem;height:2.5rem;border-radius:.8rem;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1.05rem}

/* layout */
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:1.5rem;padding:1rem 1rem 6.5rem}
.side{display:none}
main{min-width:0;max-width:820px;width:100%;margin:0 auto}
@media(min-width:1000px){
 .wrap{grid-template-columns:220px minmax(0,1fr);padding-bottom:3rem}
 .side{display:block;position:sticky;top:4.2rem;align-self:start;max-height:calc(100vh - 5rem);overflow:auto}
 .bnav{display:none!important}
 main{margin:0}
}
.side h4{font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin:1rem .6rem .3rem}
.navbtn{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:0;background:none;padding:.55rem .7rem;border-radius:.7rem;font-weight:700;font-size:.92rem}
.navbtn:hover,.navbtn.on{background:var(--card)}
.navbtn.on{color:var(--brand);box-shadow:var(--shadow)}
.navbtn .dot{width:.6rem;height:.6rem;border-radius:50%}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom))}
.bnav button{border:0;background:none;padding:.35rem 0;border-radius:.8rem;font-size:.72rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.1rem}
.bnav button b{font-size:1.25rem;line-height:1.2}
.bnav button.on{color:var(--brand);background:var(--card2)}

/* drawer */
.drawer{position:fixed;inset:0;z-index:60;background:rgba(10,14,25,.45);display:flex;align-items:flex-end}
.drawer .sheet{background:var(--bg);width:100%;max-height:85vh;overflow:auto;border-radius:1.4rem 1.4rem 0 0;padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom))}
.drawer .grip{width:3rem;height:.3rem;border-radius:9px;background:var(--line);margin:0 auto .8rem}
@media(min-width:700px){.drawer{align-items:center;justify-content:center}.drawer .sheet{max-width:560px;border-radius:1.4rem}}

/* generic */
h1{font-size:1.55rem;line-height:1.3;margin:.2rem 0 .3rem;letter-spacing:-.03em}
h2{font-size:1.15rem;margin:0 0 .6rem;letter-spacing:-.02em}
h3{font-size:1.02rem;margin:0 0 .6rem;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.05rem;margin:0 0 .9rem;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:.85rem}.tiny{font-size:.75rem}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:.8rem;padding:.6rem .95rem;font-weight:700;font-size:.92rem;min-height:2.75rem;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.soft{background:var(--card2)}
.btn.warn{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.1rem .1rem .5rem;margin:0 -1rem .4rem;padding-left:1rem;padding-right:1rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:.42rem .85rem;font-weight:700;font-size:.85rem;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--card2);border-radius:.9rem;padding:.25rem;gap:.2rem;margin:0 0 .9rem}
.seg button{flex:1;border:0;background:none;border-radius:.7rem;padding:.55rem .3rem;font-weight:800;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.badge{display:inline-block;border-radius:99px;padding:.08rem .55rem;font-size:.72rem;font-weight:800;background:var(--card2);color:var(--muted);border:1px solid var(--line);vertical-align:middle}
.badge.era{color:#fff;border:0}
.badge.add{background:var(--fix-bg);color:var(--fix-ink);border:0}
.note{border-radius:.9rem;padding:.75rem .9rem;background:var(--card2);font-size:.88rem;margin:0 0 .9rem}
.note.warn{background:var(--trap-bg)}
.bar{height:.45rem;border-radius:9px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--era);border-radius:9px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
@media(min-width:700px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* home */
.hero{border-radius:1.4rem;padding:1.3rem 1.2rem;background:linear-gradient(140deg,#1d2b52 0%,#2f5bd3 60%,#7a4fc4 100%);color:#fff;margin-bottom:1rem;position:relative;overflow:hidden}
.hero:after{content:'史';position:absolute;right:-.5rem;bottom:-2.6rem;font-size:9rem;font-weight:900;opacity:.1}
.hero .big{font-size:2.6rem;font-weight:900;line-height:1;letter-spacing:-.04em}
.hero p{margin:.4rem 0 0;color:#dfe7ff;font-size:.92rem}
.hero .todayline{margin-top:1rem;background:rgba(255,255,255,.14);border-radius:.9rem;padding:.7rem .85rem;font-size:.92rem}
.hero .btn{background:#fff;color:#1d2b52;border:0;margin-top:1rem}
.act{border:0;border-radius:1.1rem;padding:1rem;text-align:left;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);min-height:6.4rem;display:flex;flex-direction:column;gap:.25rem}
.act b{font-size:1.4rem}
.act strong{font-size:1rem}
.act span{font-size:.78rem;color:var(--muted)}
.eracard{border:1px solid var(--line);background:var(--card);border-radius:1.1rem;padding:.85rem .9rem;text-align:left;display:block;width:100%;border-left:.4rem solid var(--era)}
.eracard .t{font-weight:900}
.eracard .mini{display:grid;grid-template-columns:3.2rem 1fr 2.6rem;align-items:center;gap:.4rem;font-size:.72rem;color:var(--muted);margin-top:.3rem}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.tool{border:1px solid var(--line);background:var(--card);border-radius:1rem;padding:.7rem .2rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:.75rem;font-weight:700}
.tool b{font-size:1.3rem}
.steps{counter-reset:s;list-style:none;padding:0;margin:.4rem 0}
.steps li{counter-increment:s;display:flex;gap:.6rem;align-items:flex-start;margin:.35rem 0}
.steps li:before{content:counter(s);flex:none;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:.8rem;font-weight:900;margin-top:.1rem}

/* era page */
.erahead{border-radius:1.3rem;padding:1.1rem 1.1rem 1rem;background:var(--era);color:#fff;margin-bottom:.8rem}
.erahead .rn{font-size:.8rem;font-weight:800;opacity:.85;letter-spacing:.06em}
.erahead h1{color:#fff;margin:.1rem 0}
.erahead p{margin:0;font-size:.85rem;opacity:.92}
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.05rem;margin:0 0 .85rem;box-shadow:var(--shadow);scroll-margin-top:5rem}
.blk h3{display:flex;align-items:center;gap:.45rem}
.blk h3:before{content:'';width:.35rem;height:1.05rem;border-radius:3px;background:var(--era)}
.blk ul{margin:0;padding-left:1.15rem}
.blk li{margin:.35rem 0}
.blk li::marker{color:var(--era)}
.tw{overflow-x:auto;margin:0 -.2rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:.55rem .55rem;border-bottom:1px solid var(--line)}
th{font-size:.78rem;color:var(--muted);font-weight:800;background:var(--card2)}
th:first-child{border-radius:.5rem 0 0 .5rem}th:last-child{border-radius:0 .5rem .5rem 0}
td:first-child{font-weight:800;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl li{display:grid;grid-template-columns:5.4rem 1fr;gap:.6rem;padding:.42rem 0;border-bottom:1px dashed var(--line);margin:0}
.tl li:last-child{border-bottom:0}
.tl .y{font-weight:900;color:var(--era);font-variant-numeric:tabular-nums}
.one{background:var(--one-bg);color:var(--one-ink);border:0;font-weight:700}
.one .lab{display:inline-block;font-size:.72rem;font-weight:900;background:rgba(0,0,0,.08);border-radius:99px;padding:.05rem .55rem;margin-bottom:.35rem}
.pt{background:var(--pt-bg);border:0}.pt h3:before{background:var(--pt)}.pt h3{color:var(--pt)}
.trap{background:var(--trap-bg);border:0}.trap h3:before{background:var(--trap)}.trap h3{color:var(--trap)}
.fixnote{margin-top:.7rem;background:var(--fix-bg);color:var(--fix-ink);border-radius:.8rem;padding:.6rem .75rem;font-size:.85rem}
.fixnote b{margin-right:.3rem}
.flash{animation:fl 2.2s ease}
@keyframes fl{0%,40%{background:var(--hl)}100%{background:transparent}}
.blk.flash{animation:flb 2.2s ease}
@keyframes flb{0%,40%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:var(--shadow)}}
.k{font-weight:800}
.blind .k{background:var(--blank);color:transparent!important;border-radius:.35rem;cursor:pointer;padding:0 .15rem;user-select:none;transition:.15s}
.blind .k.show{background:var(--hl);color:var(--ink)!important}
.blind .k *{color:transparent}
.focus .blk:not(.fz){display:none}
.eranav{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.pageimg{display:block;width:100%;height:auto;border-radius:.6rem;border:1px solid var(--line);background:#fff}

/* O/X */
.ox{border:1px solid var(--line);border-radius:1rem;padding:.85rem .9rem;margin:.6rem 0;background:var(--card);scroll-margin-top:5rem}
.ox .q{font-weight:700;margin:.2rem 0 .7rem;font-size:1rem}
.ox .ab{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.ox .ab button{border:2px solid var(--line);background:var(--card2);border-radius:.9rem;font-size:1.35rem;font-weight:900;min-height:3.2rem}
.ox .ab button.pick.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.ox .ab button.pick.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fb{margin-top:.7rem;border-radius:.8rem;padding:.7rem .8rem;font-size:.9rem}
.fb.ok{background:var(--good-bg)}.fb.no{background:var(--bad-bg)}
.fb .v{font-weight:900}.fb.ok .v{color:var(--good)}.fb.no .v{color:var(--bad)}
.fb .fixs{margin:.35rem 0;font-weight:700}
.fb .row{margin-top:.5rem}
.fb .btn{min-height:2.3rem;padding:.35rem .7rem;font-size:.82rem}
.scorebar{position:sticky;top:3.6rem;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:.6rem .8rem;margin-bottom:.6rem;box-shadow:var(--shadow)}

/* clue card */
.flashcard{border-radius:1.3rem;padding:1.4rem 1.1rem;min-height:14rem;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8rem;border-top:.45rem solid var(--era);width:100%}
.flashcard .front{font-size:1.4rem;font-weight:900;line-height:1.4}
.flashcard .back{font-size:1.25rem;font-weight:900;color:var(--brand)}
.flashcard .tap{font-size:.82rem;color:var(--muted)}
.stbtn{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.8rem}
.stbtn button{border:2px solid var(--line);background:var(--card);border-radius:.9rem;padding:.65rem .2rem;font-weight:800;font-size:.88rem}
.stbtn .s1{color:var(--bad)}.stbtn .s2{color:#c98a00}.stbtn .s3{color:var(--good)}
.stbtn .on{border-color:currentColor}

/* order game */
.opt{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:.9rem;padding:.7rem .8rem;margin:.45rem 0;font-weight:700;min-height:3rem}
.opt .n{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:900}
.opt.sel{border-color:var(--brand)}.opt.sel .n{background:var(--brand);color:var(--brand-ink);border:0}

/* compare */
.sides{display:grid;gap:.5rem;grid-template-columns:1fr}
@media(min-width:600px){.sides.c2{grid-template-columns:1fr 1fr}.sides.c3{grid-template-columns:repeat(3,1fr)}.sides.c4{grid-template-columns:1fr 1fr}}
.side-c{background:var(--card2);border-radius:.8rem;padding:.6rem .75rem;font-size:.9rem}
.side-c b{display:block;font-size:.8rem;color:var(--era);margin-bottom:.15rem}
.trapline{margin-top:.6rem;font-size:.85rem;color:var(--trap);font-weight:700}

/* freq */
.fq{display:grid;grid-template-columns:2.2rem 1fr auto;gap:.6rem;align-items:start;padding:.75rem 0;border-bottom:1px solid var(--line);scroll-margin-top:5rem}
.fq:last-child{border-bottom:0}
.fq .rk{width:2.2rem;height:2.2rem;border-radius:.7rem;display:grid;place-items:center;font-weight:900;color:#fff;font-size:.9rem}
.fq .ex{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.3rem}
.fq .ex span{font-size:.72rem;background:var(--card2);border-radius:.4rem;padding:.05rem .4rem;font-variant-numeric:tabular-nums}
.star{border:0;background:none;font-size:1.35rem;color:var(--line);padding:.2rem}
.star.on{color:#e3a400}

/* five */
.five{background:linear-gradient(160deg,#1d2b52,#30245e);color:#fff;border-radius:1.4rem;padding:1.2rem}
.five .clock{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums}
.fitem{display:flex;gap:.7rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:.9rem;margin:.6rem 0;font-size:1.02rem;font-weight:600;cursor:pointer}
.fitem input{width:1.4rem;height:1.4rem;flex:none;margin-top:.2rem;accent-color:var(--good)}
.fitem.done{opacity:.6}
.fitem small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:.3rem}

/* search */
.sbox{width:100%;border:2px solid var(--line);background:var(--card);border-radius:1rem;padding:.8rem 1rem;font-size:1rem}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:.9rem;padding:.7rem .85rem;margin:.45rem 0}
.res mark{background:var(--hl);color:inherit;border-radius:.2rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;z-index:80;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.9rem;font-size:.88rem;font-weight:700;max-width:92vw;width:max-content;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:.7rem}
.toast .tbtn{flex:none;border:0;background:var(--accent);color:#fff;border-radius:.6rem;padding:.35rem .7rem;font-weight:900;font-size:.82rem}
.foot{text-align:center;color:var(--muted);font-size:.75rem;margin:2rem 0 1rem}

/* print */
.printonly{display:none}
@media print{
 :root{--bg:#fff;--card:#fff;--card2:#f4f4f4;--ink:#000;--muted:#444;--line:#bbb;--shadow:none;--one-bg:#fff7d6;--pt-bg:#eef3ff;--trap-bg:#fff0ee;--fix-bg:#f3efff}
 body{background:#fff;color:#000;font-size:11pt}
 .top,.side,.bnav,.noprint,.drawer,.toast,button{display:none!important}
 .wrap{display:block;padding:0}
 main{max-width:none}
 .card,.blk,.ox{break-inside:avoid;box-shadow:none}
 .pagebox{break-after:page;margin:0;border:0;padding:0}
 .pagebox:last-child{break-after:auto}
 .pageimg{border:0;width:auto;max-width:100%;max-height:262mm;margin:0 auto}
 @page{size:A4;margin:12mm}
 .printonly{display:block}
 .blind .k{background:none;color:#000!important}
}

.logo i{background:linear-gradient(135deg,#0f8a6c,#2f5bd3)}
.hero{background:linear-gradient(140deg,#0e3b46 0%,#13806a 55%,#2f5bd3 100%)}
.hero:after{content:'國'}
.icard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 0 .8rem;box-shadow:var(--shadow);border-left:.35rem solid var(--era);scroll-margin-top:5rem;overflow:hidden}
.icard .hd{padding:.85rem 1rem .6rem}
.icard .ttl{font-size:1.12rem;font-weight:900;letter-spacing:-.02em;margin:.25rem 0 .05rem}
.icard .au{font-size:.82rem;color:var(--muted)}
.icard details summary{list-style:none;cursor:pointer;padding:.55rem 1rem;border-top:1px solid var(--line);font-weight:800;font-size:.88rem;color:var(--brand);display:flex;justify-content:space-between}
.icard details summary::-webkit-details-marker{display:none}
.icard details summary:after{content:'펼치기 ▾';color:var(--muted);font-weight:700}

const stemOf=t=>t.replace(/\s*\(.*\)$/,'').replace(/(전|가|록|기|곡)$/,'');
function mask(text,title){const s=stemOf(title);if(s.length<2)return text;const rx=new RegExp([...s].map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*'),'g');return text.replace(rx,'○○')}
const firstClause=v=>String(v).split(/[;；]/)[0].trim();
function mkReadQ(r){const [a,st,ex]=READ_OX[r.id];return{key:'rq-'+r.id,item:r.id,type:'ox',lab:'독서 · '+r.area,head:r.title,stem:st,a,ex}}
function mkLitOX(x,f){
 const own=val(x,f),pool=L.filter(y=>y.id!==x.id&&y.genre===x.genre&&val(y,f)&&val(y,f)!==own);
 const asO=!pool.length||Math.random()<.5;const other=asO?null:pick(pool);
 const shown=f==='core'?firstClause(asO?own:val(other,f)):(asO?own:val(other,f));
 return{key:`lo-${x.id}-${f}`,item:x.id,type:'ox',lab:'문학 O/X · '+x.genre,head:`「${x.title}」의 ${FL[f]}`,stem:shown,a:asO?1:0,
  ex:asO?`자료상 「${x.title}」의 ${FL[f]}: ${own}`:`이것은 「${other.title}」의 ${FL[f]}입니다. 「${x.title}」은(는) “${own}”`}}
function mkLink(x,f){
 const own=val(x,f),pool=shuffle(L.filter(y=>y.id!==x.id&&y.genre===x.genre&&val(y,f)&&val(y,f)!==own)).slice(0,3);
 if(pool.length<3)return null;const opts=shuffle([x,...pool]);
 return{key:`lk-${x.id}-${f}`,item:x.id,type:'mc',lab:'작품 연결 · '+x.genre,head:`다음 ${FL[f]}에 해당하는 작품은?`,quote:mask(f==='core'?firstClause(own):own,x.title),
  opts:opts.map(o=>({t:o.title,why:`${FL[f]}: ${f==='core'?firstClause(val(o,f)):val(o,f)}`})),a:opts.indexOf(x)}}
function itemQs(id){const x=byId(id);if(!x)return[];if(x.kind==='read')return[mkReadQ(x)];return qFields(x).flatMap(f=>[mkLitOX(x,f),mkLink(x,f)]).filter(Boolean)}
function qFromKey(k){const [t,id,f]=k.split('-'),x=byId(id);if(!x)return null;if(t==='rq')return mkReadQ(x);if(t==='lo')return val(x,f)?mkLitOX(x,f):null;if(t==='lk')return val(x,f)?mkLink(x,f):null;return null}
let QS=null;
function startQS(title,qs,back){QS={title,qs,i:0,ans:[],back:back||'quiz'}}
PAGES.quiz=function(mode,arg){
 if(mode){
  const key=mode+'/'+(arg||'');
  if(!QS||QS.key!==key||QS.i>=QS.qs.length){
   let qs=[],title='';
   if(mode==='read'){qs=shuffle(R.filter(r=>!arg||arg==='전체'||r.area===arg).map(mkReadQ));title='독서 판단 O/X'}
   else if(mode==='litox'){qs=shuffle(L.filter(x=>!arg||arg==='전체'||x.genre===arg).flatMap(x=>qFields(x).map(f=>mkLitOX(x,f)))).slice(0,20);title='문학 O/X'}
   else if(mode==='link'){qs=shuffle(L.filter(x=>!arg||arg==='전체'||x.genre===arg).flatMap(x=>qFields(x).map(f=>mkLink(x,f))).filter(Boolean)).slice(0,15);title='작품 연결 퀴즈'}
   else if(mode==='mix'){qs=shuffle([...shuffle(R).slice(0,7).map(mkReadQ),...shuffle(L.flatMap(x=>qFields(x).map(f=>mkLitOX(x,f)))).slice(0,7),...shuffle(L.flatMap(x=>qFields(x).map(f=>mkLink(x,f))).filter(Boolean)).slice(0,6)]);title='섞어서 20문항'}
   else if(mode==='item'){const x=byId(arg);qs=itemQs(arg);title=x?`「${x.title}」 문제`:''}
   else if(mode==='wrong'){qs=shuffle(Object.entries(S.hist).filter(([,h])=>h.last===0).map(([k])=>qFromKey(k)).filter(Boolean));title='틀린 개념 다시 점검'}
   if(!qs.length){toast('풀 문제가 없어요.');return go('quiz')}
   startQS(title,qs);QS.key=key;
  }
  return drawQ();
 }
 QS=null;const wrongN=Object.values(S.hist).filter(h=>h.last===0).length;
 const litQ=L.reduce((a,x)=>a+qFields(x).length,0);

  <div class="tagl">${['고전산문','고전시가','현대시'].map(g=>`<button onclick="go('quiz/litox/${g}')">${g} O/X</button><button onclick="go('quiz/link/${g}')">${g} 연결</button>`).join('')}${['인문','사회','과학기술'].map(g=>`<button onclick="go('quiz/read/${g}')">독서 ${g}</button>`).join('')}</div></div>

};
function drawQ(){
 if(QS.i>=QS.qs.length)return drawResult();
 const q=QS.qs[QS.i],a=QS.ans[QS.i],n=QS.qs.length,done=a!==undefined;
 const ok=done&&a===q.a;
 let body;
 if(q.type==='ox'){
  body=`<div class="quote">${esc(q.stem)}</div><div class="big-ox"><button class="${done&&a===1?(ok?'ok':'no'):''}" onclick="answerQ(1)" ${done?'disabled':''} aria-label="O 맞다">O</button><button class="${done&&a===0?(ok?'ok':'no'):''}" onclick="answerQ(0)" ${done?'disabled':''} aria-label="X 틀리다">X</button></div>`;
 }else{
  body=`<div class="quote">${esc(q.quote)}</div>${q.opts.map((o,i)=>`<button class="choice ${done?(i===q.a?'ok':i===a?'no':''):''}" onclick="answerQ(${i})" ${done?'disabled':''}><span class="n">${i+1}</span><span>「${esc(o.t)}」${done?`<small>${esc(o.why)}</small>`:''}</span></button>`).join('')}`;
 }
 const exp=done?`<div class="fb ${ok?'ok':'no'}" role="status"><span class="v">${ok?'⭕ 정답!':'❌ 아쉬워요'}</span> ${q.type==='ox'?`정답은 <b>${q.a?'O':'X'}</b>`:`정답은 <b>${q.a+1}번 「${esc(q.opts[q.a].t)}」</b>`}<div style="margin-top:.3rem">${esc(q.ex||'각 선택지 아래에 작품별 설명을 붙였어요. 정답 작품과 다른 점을 비교해 보세요.')}</div>
  <div class="row"><button class="btn" onclick="go('${byId(q.item).kind==='read'?'read':'lit'}/${q.item}')">관련 카드 보기</button><button class="btn ${S.weak[q.item]?'wk':''}" onclick="setWeak('${q.item}',!S.weak['${q.item}']);drawQ()">${S.weak[q.item]?'★ 헷갈림':'☆ 헷갈림'}</button></div></div>`:'';
 $('#app').innerHTML=`<div class="row between"><h1 style="margin:0;font-size:1.3rem">${esc(QS.title)}</h1><button class="btn soft" onclick="go('quiz')">그만하기</button></div>
 <div class="row between small muted" style="margin:.6rem 0 .3rem"><span>${QS.i+1} / ${n}</span><span>맞힘 ${QS.ans.filter((x,i)=>x===QS.qs[i].a).length}</span></div>
 <div class="bar" style="--era:var(--brand);margin-bottom:.8rem"><i style="width:${(QS.i+(done?1:0))/n*100}%"></i></div>
 <div class="qbox"><span class="badge">${esc(q.lab)}</span><div class="stem">${esc(q.head)}</div>${body}${exp}</div>
 <div class="grid2" style="margin-top:.8rem"><button class="btn" onclick="QS.i=Math.max(0,QS.i-1);drawQ()" ${QS.i?'':'disabled'}>← 이전</button><button class="btn pri" onclick="QS.i++;drawQ();window.scrollTo(0,0)" ${done?'':'disabled'}>${QS.i===n-1?'결과 보기':'다음 →'}</button></div>`;
}
function answerQ(c){
 const q=QS.qs[QS.i];if(QS.ans[QS.i]!==undefined)return;QS.ans[QS.i]=c;
 const h=S.hist[q.key]||{n:0,w:0,last:null};h.n++;if(c!==q.a)h.w++;h.last=c===q.a?1:0;S.hist[q.key]=h;save();drawQ();
}
function drawResult(){
 const n=QS.qs.length,ok=QS.qs.filter((q,i)=>QS.ans[i]===q.a).length,wr=QS.qs.filter((q,i)=>QS.ans[i]!==undefined&&QS.ans[i]!==q.a);
 $('#app').innerHTML=`<div class="card" style="text-align:center"><div class="tiny muted">${esc(QS.title)}</div><div style="font-size:2.6rem;font-weight:900">${ok}/${n}</div><p class="muted">정답률 ${Math.round(ok/n*100)}% ${ok===n?'🎉':''}</p>
 <div class="grid2">${wr.length?`<button class="btn pri" onclick="retryWrong()">틀린 ${wr.length}문항 다시</button>`:'<span></span>'}<button class="btn" onclick="go('review')">복습 노트</button></div></div>
 ${wr.length?`<div class="card"><h3>이번에 틀린 문제</h3>${wr.map(q=>`<div style="padding:.5rem 0;border-bottom:1px dashed var(--line)"><span class="badge">${esc(q.lab)}</span><div style="font-weight:700;margin-top:.2rem">${esc(q.head)}</div><div class="small">${esc(q.type==='ox'?q.stem:q.quote)} → 정답 ${q.type==='ox'?(q.a?'O':'X'):'「'+esc(q.opts[q.a].t)+'」'}</div><button class="btn soft" style="margin-top:.3rem;min-height:2.1rem;font-size:.8rem" onclick="go('${byId(q.item).kind==='read'?'read':'lit'}/${q.item}')">카드 보기</button></div>`).join('')}</div>`:''}
 <button class="btn block" onclick="go('quiz')">다른 문제 풀기</button>`;
}
function retryWrong(){const wr=QS.qs.filter((q,i)=>QS.ans[i]!==q.a).map(q=>qFromKey(q.key)).filter(Boolean);const k=QS.key;startQS('이번에 틀린 문제',shuffle(wr));QS.key=k;drawQ();window.scrollTo(0,0)}

/* ===== D-day 계획 ===== */
function buildPlan(){
 if(DDAY<=0)return{days:[],post:true};
 const days=DDAY,seen=new Set(),q=[];
 const add=x=>{if(x&&!seen.has(x.id)){seen.add(x.id);q.push(x)}};
 [...L,...R].filter(x=>curWrong(x.id)).forEach(add);
 [...L,...R].filter(x=>S.weak[x.id]).forEach(add);
 CAT.filter(c=>c.tier==='기본'&&!S.done[c.id]).forEach(c=>add(c.xl?byId(c.xl):c));
 ['S','A'].forEach(g=>EBS.filter(e=>e.grade===g&&!ebsDone(e)).forEach(e=>add(byId(e.sid))));
 L.filter(x=>!S.done[x.id]).forEach(add);R.filter(x=>!S.done[x.id]).forEach(add);
 CAT.filter(c=>!c.xl&&!S.done[c.id]).forEach(add);
 const work=days>1?days-1:1,per=Math.ceil(q.length/work)||0,out=[];
 for(let i=0;i<work;i++)out.push({items:q.slice(i*per,(i+1)*per)});
 if(days>1)out.push({items:[],last:true});
 return{days:out,total:q.length,per};
}
PAGES.plan=function(){
 const p=buildPlan();
 if(p.post){$('#app').innerHTML=`<h1>복습 모드</h1><p class="sub">수능이 끝났어요. 정말 수고했어요! 기록은 그대로 남아 있습니다.</p><button class="btn pri" onclick="go('review')">복습 노트 보기</button>`;return}

let lastQ='';
const norm=s=>String(s).toLowerCase().replace(/[\s·・,.()「」『』'"“”‘’\-–—:;/~]/g,'');
let IDX=null;
function buildIdx(){const I=[];
 L.forEach(x=>I.push({g:'문학 카드',x,text:[x.title,x.author,x.genre,x.sub,x.book,x.pp,...Object.keys(FL).map(k=>val(x,k))].join(' '),path:'lit/'+x.id}));
 R.forEach(x=>I.push({g:'독서 카드',x,text:[x.title,x.area,x.sub,x.book,x.pp,x.concept,x.judge,READ_OX[x.id][1]].join(' '),path:'read/'+x.id}));
 CAT.forEach(c=>I.push({g:'작품 색인',x:c,text:[c.title,c.author,c.genre,c.book,c.pp,c.tier].join(' '),path:c.xl?'lit/'+c.xl:'cat/'+c.id}));
 EBS.forEach(e=>I.push({g:'중요 S·A',x:{...e,kind:'ebs'},text:[e.title,e.author,e.genre,e.book,e.pp,e.grade+'등급','중요',e.past?'기출 '+e.past:''].join(' '),path:'ebs/'+e.id}));
 MO_DONE.forEach(m=>I.push({g:'모평 연계',x:{genre:m[0],title:m[1],author:m[2],book:m[3],pp:m[4],kind:'mo',mo:m[5]},text:[m[1],m[2],m[0],m[3],m[4],m[5]+' 모평 연계 출제'].join(' '),path:'ebs/mo'}));
 MO_AUTHOR.forEach(m=>I.push({g:'모평 연계',x:{genre:m[0],title:m[1],author:m[2],book:m[3],pp:m[4],kind:'moa',mo:m[5],other:m[6]},text:[m[1],m[2],m[0],m[3],m[4],m[5]+' 모평 같은 작가 출제',m[6]].join(' '),path:'ebs/mo'}));
 I.forEach(i=>i.n=norm(i.text));return I}
const SGROUPS=['중요 S·A','문학 카드','독서 카드','작품 색인','모평 연계'];
PAGES.search=function(){
 $('#app').innerHTML=`<h1>통합 검색</h1><p class="sub">중요 S·A·문학 카드·독서 카드·작품 색인·모평 연계 작품을 한 번에 찾아요. 작가 이름, 개념, 교재 쪽수도 돼요. 수능완성 학습맵은 <a href="${MAP_URL}">맵 안의 검색</a>을 쓰세요.</p>
 <input id="sq" class="sbox" type="search" placeholder="예: 윤동주, S등급, 행정 대집행, 수완 143" value="${esc(lastQ)}" oninput="runSearch(this.value)" autocomplete="off">
 <div class="chips" style="margin-top:.6rem">${['S등급','윤동주','대집행','귀납','현대소설','상춘곡','유배','코사인'].map(w=>`<button class="chip" onclick="$('#sq').value='${w}';runSearch('${w}')">${w}</button>`).join('')}</div><div id="sr"></div>`;
 runSearch(lastQ);setTimeout(()=>$('#sq')?.focus(),50);
};
function runSearch(q){lastQ=q;const el=$('#sr');if(!el)return;IDX=IDX||buildIdx();
 const toks=q.trim().split(/\s+/).map(norm).filter(Boolean);if(!toks.length){el.innerHTML='';return}
 const res=IDX.filter(i=>toks.every(t=>i.n.includes(t)));
 const groups=SGROUPS;
 el.innerHTML=`<p class="small muted">${groups.map(g=>`${g} ${res.filter(r=>r.g===g).length}`).join(' · ')}</p>`+
 groups.map(g=>{const rs=res.filter(r=>r.g===g);return rs.length?`<h3 style="margin-top:1rem">${g}</h3>`+rs.map(r=>{const x=r.x;const sub=x.kind==='read'?x.area+' · '+x.sub:[x.author,x.genre,(x.book||'')+' '+(x.pp?x.pp+'쪽':'')].filter(Boolean).join(' · ');
  const snip=x.kind==='read'?x.concept:x.kind==='lit'?[val(x,'emo'),val(x,'core')].filter(Boolean).join(' / '):x.kind==='ebs'?`통합표 ${x.grade} · 11종 중 ${x.cnt}곳 최상위${x.past?' · 과거 기출 '+x.past:''}`:x.kind==='mo'?`올해 ${x.mo} 모평 연계 출제`:x.kind==='moa'?`올해 ${x.mo} 모평에 같은 작가의 ${x.other} 출제 (이 작품 자체는 출제되지 않음)`:'';
  return `<button class="res" onclick="go('${r.path}')"><b>${esc(x.title)}</b> <span class="badge era" style="background:${GCOLOR[x.genre]||'#2f5bd3'}">${esc(x.genre)}</span><div class="small muted">${esc(sub)}</div>${snip?`<div class="small">${esc(snip)}</div>`:''}</button>`}).join(''):''}).join('')+(res.length?'':'<div class="card muted">결과가 없어요.</div>');
}

function exportData(){const b=new Blob([JSON.stringify({format:KEY,exportedAt:new Date().toISOString(),data:S},null,1)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='국어_학습기록_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function importData(e){const f=e.target.files[0];e.target.value='';if(!f)return;
